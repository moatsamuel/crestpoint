{% extends "main/master.html" %}

{% block title %}
  <title>Login Page</title>
{% endblock %}

{% block main %}
  <!-- ============ Login ============ -->
  <main class="form-wrap">
      <div class="form-head">
        <img src="{{url_for('static',filename = "images/crestpoint-logo.png")}}" alt="CrestPoint Clinic logo" />
        <h1>Welcome Back</h1>
        <p>Sign in to continue to your CrestPoint Clinic account.</p>
      </div>

      <form action="" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" name="email" placeholder="you@example.com" required />
        </div>

        <div class="field">
          <label for="login-password">Password</label>
          <div class="password-field">
            <input type="password" id="login-password" name="password" placeholder="Enter your password" required />
            <button type="button" class="toggle-pass">👁</button>
          </div>
        </div>
        <div class="field">
          <label for="login-role">Role</label>
          <select name="role" id="login-role" required>
            <option value="">Select Role</option>
            <option value="doctor">Doctor</option>
            <option value="patient">Patient</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Login</button>

        <p class="form-status" role="status"></p>
      </form>

      <p class="form-foot">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </p>
  </main>

{% endblock%}
