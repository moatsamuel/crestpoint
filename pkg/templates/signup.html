{% extends "master.html" %}

{% block title %}
  <title>Sign Up</title>
{% endblock%}

{% block main %}
  <!-- ============ Sign Up ============ -->
  <main class="form-wrap wide">
      <div class="form-head">
        <img src="{{url_for('static', filename='images/crestpoint-logo.png')}}" alt="CrestPoint Clinic logo" />
        <h1>Create Your Account</h1>
        <p>A few details and you're ready to go.</p>
      </div>

      <form action="" method = "post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field-row">
          <div class="field">
            <label for="signup-first">First Name</label>
            <input type="text" id="signup-first" name="first_name" placeholder="Jane" required />
          </div>
          <div class="field">
            <label for="signup-last">Last Name</label>
            <input type="text" id="signup-last" name="last_name" placeholder="Doe" required />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="signup-email">Email Address</label>
            <input type="email" id="signup-email" name="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="home-address">Date of Birth</label>
            <input type="date" name="dob" id="" placeholder="Date of Birth">
          </div>
          <div class="field">
            <label for="home-address">Address</label>
            <textarea name="address" id="home-address"></textarea>
          </div>
          <div class="field">
            <label for="signup-phone">Phone Number</label>
            <input type="tel" id="signup-phone" name="phone" placeholder="(555) 000-0000" required />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="signup-password">Password</label>
            <div class="password-field">
              <input type="password" id="signup-password" name="password" placeholder="Create a password" required />
              <button type="button" class="toggle-pass" data-toggle="#signup-password" aria-label="Show password">👁</button>
            </div>
          </div>
          <div class="field">
            <label for="signup-confirm">Confirm Password</label>
            <div class="password-field">
              <input type="password" id="signup-confirm" name="confirm_password" placeholder="Repeat your password" required />
              <button type="button" class="toggle-pass" data-toggle="#signup-confirm" aria-label="Show password">👁</button>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Sign Up</button>

        <p class="form-status" role="status"></p>
      </form>

      <p class="form-foot">
        Already have an account? <a href="login.html">Login</a>
      </p>
  </main>
{% endblock%}
