<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Specialties Management — CrestPoint Clinic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-gray-800 dark:text-gray-100 min-h-screen flex antialiased">

  {% set active_page = 'specialties' %}
  {% include 'admin/_sidebar.html' %}

  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700/60 px-6 flex items-center justify-between sticky top-0 z-20">
      <h2 class="text-lg font-extrabold text-gray-900 dark:text-white">Specialty Directory Administration</h2>
      <button onclick="showToast('Add specialty modal opened', 'info')" class="px-4 py-2 bg-indigo-600 text-white font-semibold text-xs rounded-xl shadow-sm">+ Add Specialty</button>
    </header>

    <main class="p-6 sm:p-8 space-y-6 flex-1">
      <div id="admin-specialties-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Javascript injects specialty cards -->
      </div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('admin-specialties-grid');
      const specs = JSON.parse(localStorage.getItem('crest_specialties') || '[]');
      if (grid) {
        grid.innerHTML = specs.map(s => `
          <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-gray-100 dark:border-slate-700/60 shadow-sm space-y-3">
            <h4 class="font-bold text-base text-gray-900 dark:text-white">${s.name}</h4>
            <p class="text-xs text-gray-500 dark:text-gray-400">${s.description}</p>
            <div class="text-xs font-bold text-indigo-600">${s.count} Doctors Assigned</div>
          </div>
        `).join('');
      }
    });
  </script>
</body>
</html>
