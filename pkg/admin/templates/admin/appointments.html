<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Appointment Master Table — CrestPoint Clinic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-gray-800 dark:text-gray-100 min-h-screen flex antialiased">

  {% set active_page = 'appointments' %}
  {% include 'admin/_sidebar.html' %}

  <!-- MAIN -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700/60 px-6 flex items-center justify-between sticky top-0 z-20">
      <h2 class="text-lg font-extrabold text-gray-900 dark:text-white">Master Appointments Overview</h2>
    </header>

    <main class="p-6 sm:p-8 space-y-6 flex-1">
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-gray-100 dark:border-slate-700/60 shadow-sm space-y-6">
        
        <!-- Status Filter Tabs -->
        <div class="flex items-center gap-2 border-b border-gray-100 dark:border-slate-700 pb-4 overflow-x-auto">
          <button class="status-tab px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold" data-status="all">All</button>
          <button class="status-tab px-4 py-2 bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-gray-300 rounded-xl text-xs font-bold" data-status="Pending">Pending</button>
          <button class="status-tab px-4 py-2 bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-gray-300 rounded-xl text-xs font-bold" data-status="Confirmed">Confirmed</button>
          <button class="status-tab px-4 py-2 bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-gray-300 rounded-xl text-xs font-bold" data-status="Completed">Completed</button>
          <button class="status-tab px-4 py-2 bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-gray-300 rounded-xl text-xs font-bold" data-status="Cancelled">Cancelled</button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-gray-50 dark:bg-slate-900 text-gray-500 uppercase font-semibold border-b border-gray-200 dark:border-slate-700">
              <tr>
                <th class="px-6 py-3.5">Patient</th>
                <th class="px-6 py-3.5">Doctor</th>
                <th class="px-6 py-3.5">Specialty</th>
                <th class="px-6 py-3.5">Date & Time</th>
                <th class="px-6 py-3.5">Status</th>
                <th class="px-6 py-3.5 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="master-appointments-tbody" class="divide-y divide-gray-100 dark:divide-slate-800">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>

      </div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tbody = document.getElementById('master-appointments-tbody');
      const tabs = document.querySelectorAll('.status-tab');
      let apps = JSON.parse(localStorage.getItem('crest_appointments') || '[]');
      let activeFilter = 'all';

      function render() {
        const filtered = apps.filter(a => activeFilter === 'all' || a.status.toLowerCase() === activeFilter.toLowerCase());
        if (tbody) {
          tbody.innerHTML = filtered.map(a => `
            <tr class="hover:bg-gray-50/50 dark:hover:bg-slate-800/40">
              <td class="px-6 py-4 font-bold text-gray-900 dark:text-white">${a.patientName}</td>
              <td class="px-6 py-4 font-semibold text-gray-700 dark:text-gray-300">${a.doctorName}</td>
              <td class="px-6 py-4 text-indigo-600 font-semibold">${a.specialty}</td>
              <td class="px-6 py-4">${a.date} at ${a.time}</td>
              <td class="px-6 py-4">
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold ${
                  a.status === 'Confirmed' ? 'bg-green-100 text-green-700' :
                  (a.status === 'Pending' ? 'bg-amber-100 text-amber-700' : 'bg-gray-100 text-gray-700')
                }">${a.status}</span>
              </td>
              <td class="px-6 py-4 text-right">
                <button onclick="showToast('Status updated', 'info')" class="px-2.5 py-1 bg-gray-100 rounded-lg text-xs font-bold">Update</button>
              </td>
            </tr>
          `).join('');
        }
      }

      tabs.forEach(t => {
        t.addEventListener('click', () => {
          tabs.forEach(tab => {
            tab.classList.remove('bg-indigo-600', 'text-white');
            tab.classList.add('bg-gray-100', 'dark:bg-slate-700', 'text-gray-600', 'dark:text-gray-300');
          });
          t.classList.remove('bg-gray-100', 'dark:bg-slate-700', 'text-gray-600', 'dark:text-gray-300');
          t.classList.add('bg-indigo-600', 'text-white');
          activeFilter = t.getAttribute('data-status');
          render();
        });
      });

      render();
    });
  </script>
</body>
</html>
