<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Patient Management — CrestPoint Clinic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-gray-800 dark:text-gray-100 min-h-screen flex antialiased">

  {% set active_page = 'patients' %}
  {% include 'admin/_sidebar.html' %}

  <!-- MAIN -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700/60 px-6 flex items-center justify-between sticky top-0 z-20">
      <h2 class="text-lg font-extrabold text-gray-900 dark:text-white">Patient Database Management</h2>
      <button onclick="openModal('add-patient-modal')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-xl shadow-sm flex items-center gap-2">
        <i data-lucide="user-plus" class="w-4 h-4"></i> + Add Patient
      </button>
    </header>

    <main class="p-6 sm:p-8 space-y-6 flex-1">
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-gray-100 dark:border-slate-700/60 shadow-sm space-y-6">
        
        <div class="relative max-w-md">
          <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="search-patient-input" placeholder="Search patients by name, email, or phone..." class="w-full pl-9 pr-4 py-2 bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl text-xs">
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-gray-50 dark:bg-slate-900 text-gray-500 uppercase font-semibold border-b border-gray-200 dark:border-slate-700">
              <tr>
                <th class="px-6 py-3.5">Patient</th>
                <th class="px-6 py-3.5">Email</th>
                <th class="px-6 py-3.5">Phone</th>
                <th class="px-6 py-3.5">Date of Birth</th>
                <th class="px-6 py-3.5">Appointments</th>
                <th class="px-6 py-3.5">Status</th>
                <th class="px-6 py-3.5 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="patients-table-body" class="divide-y divide-gray-100 dark:divide-slate-800">
              <!-- Rendered by js/patients.js -->
            </tbody>
          </table>
        </div>

      </div>
    </main>
  </div>

  <!-- ADD PATIENT MODAL -->
  <div id="add-patient-modal" class="modal-container hidden fixed inset-0 z-50 items-center justify-center p-4">
    <div class="modal-overlay absolute inset-0"></div>
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 relative z-10 shadow-2xl space-y-4">
      <h3 class="text-lg font-bold text-gray-900 dark:text-white">Add New Patient Record</h3>
      
      <form id="add-patient-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold mb-1">Full Patient Name</label>
          <input type="text" id="pat-name-input" required placeholder="Jane Doe" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700 text-xs">
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1">Email Address</label>
          <input type="email" id="pat-email-input" required placeholder="jane.doe@example.com" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700 text-xs">
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1">Phone Number</label>
          <input type="tel" id="pat-phone-input" required placeholder="+1 (555) 000-1111" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700 text-xs">
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('add-patient-modal')" class="px-4 py-2 border rounded-xl text-xs">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">Add Patient</button>
        </div>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/patients.js') }}"></script>
</body>
</html>
