<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin System Settings — CrestPoint Clinic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-gray-800 dark:text-gray-100 min-h-screen flex antialiased">

  {% set active_page = 'settings' %}
  {% include 'admin/_sidebar.html' %}

  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700/60 px-6 flex items-center justify-between sticky top-0 z-20">
      <h2 class="text-lg font-extrabold text-gray-900 dark:text-white">System Settings & Operations</h2>
    </header>

    <main class="p-6 sm:p-8 max-w-4xl flex-1 space-y-6">
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-gray-100 dark:border-slate-700/60 shadow-sm space-y-4">
        <h4 class="text-sm font-bold text-gray-900 dark:text-white border-b border-gray-100 dark:border-slate-700 pb-3">Clinic System Preferences</h4>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
          <div>
            <label class="block font-semibold mb-1">Clinic Name</label>
            <input type="text" value="CrestPoint Clinic" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700">
          </div>
          <div>
            <label class="block font-semibold mb-1">Clinic Tagline</label>
            <input type="text" value="Connected Care. Better Health." class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700">
          </div>
        </div>

        <div class="pt-4 border-t border-gray-100 dark:border-slate-700 flex justify-end">
          <button onclick="showToast('System configuration saved!', 'success')" class="px-6 py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl">Save System Settings</button>
        </div>
      </div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
