<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Doctor Management — CrestPoint Clinic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-gray-800 dark:text-gray-100 min-h-screen flex antialiased">

  {% set active_page = 'doctors' %}
  {% include 'admin/_sidebar.html' %}

  <!-- MAIN -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700/60 px-6 flex items-center justify-between sticky top-0 z-20">
      <h2 class="text-lg font-extrabold text-gray-900 dark:text-white">Doctor Staff Management</h2>
      <button onclick="openModal('add-doctor-modal')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-xl shadow-sm flex items-center gap-2">
        <i data-lucide="plus" class="w-4 h-4"></i> + Add Doctor
      </button>
    </header>

    <main class="p-6 sm:p-8 space-y-6 flex-1">
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-gray-100 dark:border-slate-700/60 shadow-sm space-y-6">
        
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-gray-50 dark:bg-slate-900 text-gray-500 uppercase font-semibold border-b border-gray-200 dark:border-slate-700">
              <tr>
                <th class="px-6 py-3.5">Doctor</th>
                <th class="px-6 py-3.5">Specialty</th>
                <th class="px-6 py-3.5">Experience</th>
                <th class="px-6 py-3.5">Consultation Fee</th>
                <th class="px-6 py-3.5">Status</th>
                <th class="px-6 py-3.5 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="admin-doctors-tbody" class="divide-y divide-gray-100 dark:divide-slate-800">
              <!-- Rendered by inline script below -->
            </tbody>
          </table>
        </div>

      </div>
    </main>
  </div>

  <!-- ADD DOCTOR MODAL -->
  <div id="add-doctor-modal" class="modal-container hidden fixed inset-0 z-50 items-center justify-center p-4">
    <div class="modal-overlay absolute inset-0"></div>
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 relative z-10 shadow-2xl space-y-4">
      <h3 class="text-lg font-bold text-gray-900 dark:text-white">Add New Physician</h3>
      
      <form id="add-doc-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold mb-1">Doctor Name</label>
          <input type="text" id="new-doc-name" required placeholder="Dr. John Doe" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700 text-xs">
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1">Specialty</label>
          <select id="new-doc-specialty" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700 text-xs">
            <option value="Cardiology">Cardiology</option>
            <option value="Pediatrics">Pediatrics</option>
            <option value="Dentistry">Dentistry</option>
            <option value="Neurology">Neurology</option>
            <option value="Dermatology">Dermatology</option>
            <option value="Orthopedics">Orthopedics</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold mb-1">Years Experience</label>
            <input type="number" id="new-doc-exp" value="5" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700 text-xs">
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Consultation Fee ($)</label>
            <input type="number" id="new-doc-fee" value="150" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700 text-xs">
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('add-doctor-modal')" class="px-4 py-2 border rounded-xl text-xs">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">Add Doctor</button>
        </div>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tbody = document.getElementById('admin-doctors-tbody');
      let doctors = JSON.parse(localStorage.getItem('crest_doctors') || '[]');

      function render() {
        if (tbody) {
          tbody.innerHTML = doctors.map(d => `
            <tr class="hover:bg-gray-50/50 dark:hover:bg-slate-800/40">
              <td class="px-6 py-4 font-bold text-gray-900 dark:text-white flex items-center gap-3">
                <img src="${d.image}" class="w-8 h-8 rounded-full object-cover">
                <span>${d.name}</span>
              </td>
              <td class="px-6 py-4 text-indigo-600 font-semibold">${d.specialty}</td>
              <td class="px-6 py-4">${d.experience} Years</td>
              <td class="px-6 py-4 font-bold text-gray-900 dark:text-white">$${d.fee}</td>
              <td class="px-6 py-4">
                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-green-100 text-green-700">Active</span>
              </td>
              <td class="px-6 py-4 text-right flex items-center justify-end gap-2">
                <button onclick="showToast('Edit doctor modal opened', 'info')" class="px-2.5 py-1 bg-gray-100 hover:bg-gray-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-lg text-xs font-bold text-gray-700 dark:text-gray-200 transition-colors">Edit</button>
                <button class="delete-doc-btn px-2.5 py-1 bg-red-50 hover:bg-red-100 dark:bg-red-900/30 dark:hover:bg-red-900/50 rounded-lg text-xs font-bold text-red-600 dark:text-red-400 transition-colors" data-id="${d.id}">Delete</button>
              </td>
            </tr>
          `).join('');

          document.querySelectorAll('.delete-doc-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              const id = btn.getAttribute('data-id');
              doctors = doctors.filter(d => d.id !== id);
              localStorage.setItem('crest_doctors', JSON.stringify(doctors));
              showToast('Doctor record removed successfully', 'warning');
              render();
            });
          });
        }
      }

      const form = document.getElementById('add-doc-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const name = document.getElementById('new-doc-name').value;
          const specialty = document.getElementById('new-doc-specialty').value;
          const exp = document.getElementById('new-doc-exp').value;
          const fee = document.getElementById('new-doc-fee').value;

          const newD = {
            id: 'doc-' + Date.now(),
            name,
            specialty,
            experience: exp,
            fee: fee,
            rating: 5.0,
            availability: 'Available Today',
            languages: ['English'],
            image: 'https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&q=80&w=300'
          };
          doctors.unshift(newD);
          localStorage.setItem('crest_doctors', JSON.stringify(doctors));
          showToast('New doctor added successfully!', 'success');
          closeModal('add-doctor-modal');
          render();
        });
      }

      render();
    });
  </script>
</body>
</html>
