<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Documents Audit — CrestPoint Clinic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-gray-800 dark:text-gray-100 min-h-screen flex antialiased">

  {% set active_page = 'documents' %}
  {% include 'admin/_sidebar.html' %}

  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700/60 px-6 flex items-center justify-between sticky top-0 z-20">
      <h2 class="text-lg font-extrabold text-gray-900 dark:text-white">System Document Repository & HIPAA Audit</h2>
    </header>

    <main class="p-6 sm:p-8 space-y-6 flex-1">
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-gray-100 dark:border-slate-700/60 shadow-sm space-y-6">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-gray-50 dark:bg-slate-900 text-gray-500 uppercase font-semibold border-b border-gray-200 dark:border-slate-700">
              <tr>
                <th class="px-6 py-3.5">Document Title</th>
                <th class="px-6 py-3.5">Category</th>
                <th class="px-6 py-3.5">Date Uploaded</th>
                <th class="px-6 py-3.5">Doctor Reference</th>
                <th class="px-6 py-3.5">Status</th>
                <th class="px-6 py-3.5 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="documents-table-body" class="divide-y divide-gray-100 dark:divide-slate-800">
              <!-- Rendered by js/documents.js -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/documents.js') }}"></script>
</body>
</html>
