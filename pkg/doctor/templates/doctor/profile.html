<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Profile Settings — CrestPoint Clinic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-gray-800 dark:text-gray-100 min-h-screen flex antialiased">

  <aside class="w-64 bg-white dark:bg-slate-800 border-r border-gray-200 dark:border-slate-700/60 hidden lg:flex flex-col justify-between h-screen sticky top-0 z-30">
    <div class="p-6">
      <a href="../index.html" class="flex items-center gap-3 mb-8">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold">
          <i data-lucide="cross" class="w-5 h-5"></i>
        </div>
        <div>
          <span class="font-black text-gray-900 dark:text-white block leading-none text-lg">CrestPoint</span>
          <span class="text-[9px] font-bold uppercase tracking-widest text-indigo-600 dark:text-indigo-400 block">Doctor Portal</span>
        </div>
      </a>

      <nav class="space-y-1 text-sm font-medium">
        <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-50">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
        </a>
        <a href="appointments.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-50">
          <i data-lucide="calendar" class="w-4 h-4"></i> Appointments
        </a>
        <a href="patients.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-50">
          <i data-lucide="users" class="w-4 h-4"></i> Patients
        </a>
        <a href="schedule.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-50">
          <i data-lucide="clock" class="w-4 h-4"></i> Schedule
        </a>
        <a href="documents.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-50">
          <i data-lucide="file-text" class="w-4 h-4"></i> Documents
        </a>
        <a href="profile.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 font-bold">
          <i data-lucide="user" class="w-4 h-4"></i> Profile
        </a>
        <a href="settings.html" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-50">
          <i data-lucide="settings" class="w-4 h-4"></i> Settings
        </a>
      </nav>
    </div>

    <div class="p-4 border-t border-gray-100 dark:border-slate-700/60">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img src="https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&q=80&w=200" class="w-9 h-9 rounded-full object-cover">
          <div>
            <h5 class="text-xs font-bold text-gray-900 dark:text-white">Dr. Sarah Johnson</h5>
            <span class="text-[10px] text-gray-400">Cardiologist</span>
          </div>
        </div>
        <a href="../login.html" class="p-2 text-gray-400 hover:text-red-500 rounded-lg"><i data-lucide="log-out" class="w-4 h-4"></i></a>
      </div>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700/60 px-6 flex items-center justify-between sticky top-0 z-20">
      <h2 class="text-lg font-extrabold text-gray-900 dark:text-white">Doctor Public Profile & Credentials</h2>
    </header>

    <main class="p-6 sm:p-8 max-w-4xl flex-1 space-y-6">
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-8 border border-gray-100 dark:border-slate-700/60 shadow-sm space-y-6">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
          <div>
            <label class="block font-semibold mb-1">Full Doctor Name</label>
            <input type="text" value="Dr. Sarah Johnson" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700">
          </div>
          <div>
            <label class="block font-semibold mb-1">Specialty</label>
            <input type="text" value="Cardiology" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700">
          </div>
          <div>
            <label class="block font-semibold mb-1">Consultation Fee ($)</label>
            <input type="number" value="150" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700">
          </div>
          <div>
            <label class="block font-semibold mb-1">Years of Experience</label>
            <input type="number" value="12" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1">Public Biography</label>
          <textarea rows="4" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700 text-xs">Dr. Sarah Johnson is a board-certified Cardiologist with over 12 years of experience specializing in preventative cardiology and heart failure management.</textarea>
        </div>

        <div class="pt-4 border-t border-gray-100 dark:border-slate-700 flex justify-end">
          <button onclick="showToast('Public profile updated!', 'success')" class="px-6 py-2.5 bg-indigo-600 text-white font-bold text-xs rounded-xl">Save Changes</button>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
